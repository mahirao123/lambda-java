<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script})}">

<head>
    <title>Add Subcategory Advertisement</title>
</head>

<body>

<div id="content" class="flex-1 px-4 sm:ml-64 transition-all duration-300">

	<!-- Message -->
	<div data-th-replace="~{message::messagebox}"></div>
	
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-6 md:p-8">

        <!-- FORM HEADER -->
        <div class="mb-8 border-b pb-4">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800">
                Subcategory Advertisement
            </h1>

            <p class="mt-2 text-sm text-gray-500">
                Enter the advertisement URLs.
            </p>
        </div>

        <!-- FORM -->
        <form th:action="@{'/editor/subcategory/advertisement/update/'+${id}}"
              th:object="${subCategoryForm}"
              method="post"
              class="space-y-6">

            <!-- SUBCATEGORY NAME -->
            <div>
                <label for="name"
                       class="block mb-2 text-sm font-semibold text-gray-700">
                    Subcategory Name
                    <span class="text-red-600">*</span>
                </label>

                <input type="text"
                       id="name"
                       th:field="*{name}"
                       placeholder="Enter subcategory name"
                       required
                       maxlength="150"
                       class="w-full rounded-lg border border-gray-300
                              bg-gray-50 p-3 text-sm text-gray-900
                              focus:border-blue-500 focus:ring-blue-500" readonly>
            </div>

            <!-- LONG FRAME ADVERTISEMENT -->
            <div>
                <label for="longFrameAdvertisement"
                       class="block mb-2 text-sm font-semibold text-gray-700">
                    Long Frame Advertisement URL
                </label>

                <input type="url"
                       id="longFrameAdvertisement"
                       th:field="*{longFrameAdvertisement}"
                       placeholder="https://example.com/long-ad"
                       class="w-full rounded-lg border border-gray-300
                              bg-gray-50 p-3 text-sm text-gray-900
                              focus:border-blue-500 focus:ring-blue-500">

                <p class="mt-1 text-xs text-gray-500">
                    Enter the URL for the long-frame advertisement.
                </p>
            </div>

            <!-- LEFT SIDE ADVERTISEMENT -->
            <div>
                <label for="sortFrameAdvertisement1"
                       class="block mb-2 text-sm font-semibold text-gray-700">
                    Left Side Advertisement URL
                </label>

                <input type="url"
                       id="sortFrameAdvertisement1"
                       th:field="*{sortFrameAdvertisement1}"
                       placeholder="https://example.com/left-ad"
                       class="w-full rounded-lg border border-gray-300
                              bg-gray-50 p-3 text-sm text-gray-900
                              focus:border-blue-500 focus:ring-blue-500">

                <p class="mt-1 text-xs text-gray-500">
                    Enter the URL for the left-side advertisement.
                </p>
            </div>

            <!-- RIGHT SIDE ADVERTISEMENT -->
            <div>
                <label for="sortFrameAdvertisement2"
                       class="block mb-2 text-sm font-semibold text-gray-700">
                    Right Side Advertisement URL
                </label>

                <input type="url"
                       id="sortFrameAdvertisement2"
                       th:field="*{sortFrameAdvertisement2}"
                       placeholder="https://example.com/right-ad"
                       class="w-full rounded-lg border border-gray-300
                              bg-gray-50 p-3 text-sm text-gray-900
                              focus:border-blue-500 focus:ring-blue-500">

                <p class="mt-1 text-xs text-gray-500">
                    Enter the URL for the right-side advertisement.
                </p>
            </div>

<!-- BUTTONS -->
<div class="flex flex-col md:flex-row gap-3 pt-4 border-t">

    <button type="submit"
            class="w-full md:w-auto rounded-lg bg-blue-600
                   px-6 py-3 text-sm font-semibold text-white
                   hover:bg-blue-700 focus:ring-4
                   focus:ring-blue-300">
        Save Advertisement
    </button>

    <a th:href="@{'/editor/category/subcategory/advertisement/'+${id}}"
       class="w-full md:w-auto rounded-lg bg-gray-200
              px-6 py-3 text-center text-sm font-semibold
              text-gray-800 hover:bg-gray-300">
        Back
    </a>

</div>

        </form>

    </div>

</div>

<script>
</script>

</body>
</html>
