<div  th:fragment="epaperHeader">
	<header 

	class="bg-white border-b shadow-sm sticky top-0 z-30">

	    <div class="max-w-[1600px] mx-auto px-4">

	        <div class="flex items-center justify-between h-20">

	            <!-- ================================================= -->
	            <!-- LOGO + CALENDAR + LANGUAGE -->
	            <!-- ================================================= -->

	            <div class="flex items-center gap-3">

	                <!-- ================================================= -->
	                <!-- LOGO -->
	                <!-- ================================================= -->

	                <div>

	                    <h1 class="text-sm sm:text-xl md:text-2xl font-bold text-gray-900">
	                        E-PAPER
	                    </h1>

	                    <p class="text-sm text-gray-500">
	                        Digital Newspaper
	                    </p>

	                </div>


	                <!-- ================================================= -->
	                <!-- CALENDAR -->
	                <!-- ================================================= -->

	                <div class="relative">

	                    <button id="calendarButton"
	                            type="button"
	                            class="flex items-center gap-3
	                                   px-4 py-2
	                                   bg-white
	                                   border border-gray-300
	                                   rounded-xl
	                                   shadow-sm
	                                   hover:border-red-500
	                                   hover:shadow-md
	                                   transition">

	                        <!-- ICON -->

	                        <div class="flex items-center justify-center
	                                    w-10 h-10
	                                    bg-red-50
	                                    text-red-600
	                                    rounded-lg">

	                            <svg xmlns="http://www.w3.org/2000/svg"
	                                 class="w-6 h-6"
	                                 fill="none"
	                                 viewBox="0 0 24 24"
	                                 stroke="currentColor">

	                                <path stroke-linecap="round"
	                                      stroke-linejoin="round"
	                                      stroke-width="2"
	                                      d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>

	                            </svg>

	                        </div>


	                        <!-- DATE -->

	                        <div id="calendarDateContainer"
	                             class="text-left">

	                            <div id="calendarButtonDate"
	                                 class="text-sm font-bold text-gray-900">

	                                Current Date

	                            </div>

	                            <div id="calendarButtonDay"
	                                 class="text-xs text-gray-500">

	                                Today

	                            </div>

	                        </div>


	                        <!-- ARROW -->

	                        <svg xmlns="http://www.w3.org/2000/svg"
	                             class="w-4 h-4 text-gray-500"
	                             fill="none"
	                             viewBox="0 0 24 24"
	                             stroke="currentColor">

	                            <path stroke-linecap="round"
	                                  stroke-linejoin="round"
	                                  stroke-width="2"
	                                  d="M19 9l-7 7-7-7"/>

	                        </svg>

	                    </button>


	                    <!-- ================================================= -->
	                    <!-- CALENDAR POPUP -->
	                    <!-- ================================================= -->

	                    <div id="calendarPopup"
	                         class="hidden absolute top-full left-1/2
	                                -translate-x-1/2 mt-3
	                                bg-white rounded-2xl
	                                shadow-2xl
	                                border border-gray-200
	                                p-6 z-[100]"
	                         style="width:300px; max-width:calc(100vw - 2rem);">

	                        <div class="flex items-center justify-between mb-5">

	                            <button id="previousMonth"
	                                    type="button"
	                                    class="w-9 h-9
	                                           flex items-center justify-center
	                                           rounded-full
	                                           hover:bg-gray-100
	                                           text-xl">

	                                ‹

	                            </button>


	                            <div id="monthTitle"
	                                 class="font-bold text-lg text-gray-900">
	                            </div>


	                            <button id="nextMonth"
	                                    type="button"
	                                    class="w-9 h-9
	                                           flex items-center justify-center
	                                           rounded-full
	                                           hover:bg-gray-100
	                                           text-xl">

	                                ›

	                            </button>

	                        </div>


	                        <div class="grid grid-cols-7
	                                    text-center
	                                    text-xs
	                                    font-semibold
	                                    text-gray-500
	                                    mb-2">

	                            <div>रवि</div>
	                            <div>सोम</div>
	                            <div>मंगल</div>
	                            <div>बुध</div>
	                            <div>गुरु</div>
	                            <div>शुक्र</div>
	                            <div>शनि</div>

	                        </div>


	                        <div id="calendar"
	                             class="grid grid-cols-7 gap-1 text-sm">
	                        </div>


	                        <div class="mt-5 pt-4 border-t text-xs text-gray-500">

	                            <div class="flex items-center gap-2">

	                                <span class="w-2.5 h-2.5 rounded-full bg-red-600"></span>

	                                <span>
	                                    E-Paper available
	                                </span>

	                            </div>

	                        </div>

	                    </div>


	                    <!-- ================================================= -->
	                    <!-- CATEGORY DATA -->
	                    <!-- ================================================= -->

	                    <div id="categoryData"
	                         class="hidden">

	                        <span th:each="category : ${categories}"
	                              class="category-data"
	                              th:attr="data-date=${category.date},
	                                       data-category-id=${category.id}">
	                        </span>

	                    </div>

	                </div>


	                <!-- ================================================= -->
	                <!-- LANGUAGE -->
	                <!-- ================================================= -->

	                <div class="relative">

	                    <button id="languageButton"
	                            type="button"
	                            class="flex items-center gap-3
	                                   px-4 py-2
	                                   bg-white
	                                   border border-gray-300
	                                   rounded-xl
	                                   shadow-sm
	                                   hover:border-red-500
	                                   hover:shadow-md
	                                   transition">

	                        <!-- LANGUAGE ICON -->

	                        <div class="flex items-center justify-center
	                                    w-10 h-10
	                                    bg-red-50
	                                    text-red-600
	                                    rounded-lg">

	                            <svg xmlns="http://www.w3.org/2000/svg"
	                                 class="w-6 h-6"
	                                 fill="none"
	                                 viewBox="0 0 24 24"
	                                 stroke="currentColor">

	                                <path stroke-linecap="round"
	                                      stroke-linejoin="round"
	                                      stroke-width="2"
	                                      d="M3 5h12M9 3v2m0 0c0 4-2 7-5 9m5-9c0 3 2 6 5 8M5 21l4-4m0 0l4 4m-4-4v-5m7-9h5m-2 0v14"/>

	                            </svg>

	                        </div>


	                        <!-- SELECTED LANGUAGE -->

	                        <div id="languageContainer"
	                             class="text-left">

	                            <div id="selectedLanguage"
	                                 class="text-sm font-bold text-gray-900">

	                                हिन्दी

	                            </div>

	                            <span th:text="#{language}">
	                                Language
	                            </span>

	                        </div>


	                        <!-- ARROW -->

	                        <svg id="languageButtonArrow"
	                             xmlns="http://www.w3.org/2000/svg"
	                             class="w-4 h-4 text-gray-500"
	                             fill="none"
	                             viewBox="0 0 24 24"
	                             stroke="currentColor">

	                            <path stroke-linecap="round"
	                                  stroke-linejoin="round"
	                                  stroke-width="2"
	                                  d="M19 9l-7 7-7-7"/>

	                        </svg>

	                    </button>


	                    <!-- ================================================= -->
	                    <!-- LANGUAGE POPUP -->
	                    <!-- ================================================= -->

	                    <div id="languagePopup"
	                         class="hidden absolute top-full right-0
	                                mt-3
	                                bg-white
	                                rounded-2xl
	                                shadow-2xl
	                                border border-gray-200
	                                p-4
	                                z-[100]"
	                         style="width:360px; max-width:calc(100vw - 2rem);">

	                        <!-- HEADER -->

	                        <div class="flex items-center justify-between
	                                    pb-3 mb-3 border-b">

	                            <div>

	                                <h3 class="font-bold text-gray-900"
	                                    th:text="#{select.language}">
	                                    Select Language
	                                </h3>

	                                <p class="text-xs text-gray-500">
	                                    अपनी भाषा चुनें
	                                </p>

	                            </div>


	                            <button id="closeLanguagePopup"
	                                    type="button"
	                                    class="w-8 h-8
	                                           flex items-center justify-center
	                                           rounded-full
	                                           hover:bg-gray-100
	                                           text-gray-500
	                                           text-xl">

	                                ×

	                            </button>

	                        </div>


	                        <!-- LANGUAGES -->

	                        <div id="languageList"
	                             class="grid grid-cols-2 gap-2">

	                            <!-- HINDI -->

	                            <button type="button"
	                                    class="language-option
	                                           flex items-center justify-between
	                                           px-3 py-3
	                                           rounded-xl
	                                           border border-red-200
	                                           bg-red-50
	                                           hover:bg-red-100
	                                           transition"
	                                    data-language="hi"
	                                    data-name="हिन्दी">

	                                <span class="font-semibold text-gray-800">
	                                    हिन्दी
	                                </span>

	                                <span class="text-xs text-gray-400">
	                                    हिंदी
	                                </span>

	                            </button>


	                            <!-- ENGLISH -->

	                            <button type="button"
	                                    class="language-option
	                                           flex items-center justify-between
	                                           px-3 py-3
	                                           rounded-xl
	                                           border border-gray-200
	                                           hover:border-red-300
	                                           hover:bg-red-50
	                                           transition"
	                                    data-language="en"
	                                    data-name="English">

	                                <span class="font-semibold text-gray-800">
	                                    English
	                                </span>

	                                <span class="text-xs text-gray-400">
	                                    EN
	                                </span>

	                            </button>


	                            <!-- BENGALI -->

	                            <button type="button"
	                                    class="language-option
	                                           flex items-center justify-between
	                                           px-3 py-3
	                                           rounded-xl
	                                           border border-gray-200
	                                           hover:border-red-300
	                                           hover:bg-red-50
	                                           transition"
	                                    data-language="bn"
	                                    data-name="বাংলা">

	                                <span class="font-semibold text-gray-800">
	                                    বাংলা
	                                </span>

	                                <span class="text-xs text-gray-400">
	                                    বাংলা
	                                </span>

	                            </button>


	                            <!-- MARATHI -->

	                            <button type="button"
	                                    class="language-option
	                                           flex items-center justify-between
	                                           px-3 py-3
	                                           rounded-xl
	                                           border border-gray-200
	                                           hover:border-red-300
	                                           hover:bg-red-50
	                                           transition"
	                                    data-language="mr"
	                                    data-name="मराठी">

	                                <span class="font-semibold text-gray-800">
	                                    मराठी
	                                </span>

	                                <span class="text-xs text-gray-400">
	                                    मराठी
	                                </span>

	                            </button>


	                            <!-- GUJARATI -->

	                            <button type="button"
	                                    class="language-option
	                                           flex items-center justify-between
	                                           px-3 py-3
	                                           rounded-xl
	                                           border border-gray-200
	                                           hover:border-red-300
	                                           hover:bg-red-50
	                                           transition"
	                                    data-language="gu"
	                                    data-name="ગુજરાતી">

	                                <span class="font-semibold text-gray-800">
	                                    ગુજરાતી
	                                </span>

	                                <span class="text-xs text-gray-400">
	                                    ગુજરાતી
	                                </span>

	                            </button>


	                            <!-- TAMIL -->

	                            <button type="button"
	                                    class="language-option
	                                           flex items-center justify-between
	                                           px-3 py-3
	                                           rounded-xl
	                                           border border-gray-200
	                                           hover:border-red-300
	                                           hover:bg-red-50
	                                           transition"
	                                    data-language="ta"
	                                    data-name="தமிழ்">

	                                <span class="font-semibold text-gray-800">
	                                    தமிழ்
	                                </span>

	                                <span class="text-xs text-gray-400">
	                                    தமிழ்
	                                </span>

	                            </button>


	                            <!-- TELUGU -->

	                            <button type="button"
	                                    class="language-option
	                                           flex items-center justify-between
	                                           px-3 py-3
	                                           rounded-xl
	                                           border border-gray-200
	                                           hover:border-red-300
	                                           hover:bg-red-50
	                                           transition"
	                                    data-language="te"
	                                    data-name="తెలుగు">

	                                <span class="font-semibold text-gray-800">
	                                    తెలుగు
	                                </span>

	                                <span class="text-xs text-gray-400">
	                                    తెలుగు
	                                </span>

	                            </button>


	                            <!-- KANNADA -->

	                            <button type="button"
	                                    class="language-option
	                                           flex items-center justify-between
	                                           px-3 py-3
	                                           rounded-xl
	                                           border border-gray-200
	                                           hover:border-red-300
	                                           hover:bg-red-50
	                                           transition"
	                                    data-language="kn"
	                                    data-name="ಕನ್ನಡ">

	                                <span class="font-semibold text-gray-800">
	                                    ಕನ್ನಡ
	                                </span>

	                                <span class="text-xs text-gray-400">
	                                    ಕನ್ನಡ
	                                </span>

	                            </button>


	                            <!-- MALAYALAM -->

	                            <button type="button"
	                                    class="language-option
	                                           flex items-center justify-between
	                                           px-3 py-3
	                                           rounded-xl
	                                           border border-gray-200
	                                           hover:border-red-300
	                                           hover:bg-red-50
	                                           transition"
	                                    data-language="ml"
	                                    data-name="മലയാളം">

	                                <span class="font-semibold text-gray-800">
	                                    മലയാളം
	                                </span>

	                                <span class="text-xs text-gray-400">
	                                    മലയാളം
	                                </span>

	                            </button>


	                            <!-- PUNJABI -->

	                            <button type="button"
	                                    class="language-option
	                                           flex items-center justify-between
	                                           px-3 py-3
	                                           rounded-xl
	                                           border border-gray-200
	                                           hover:border-red-300
	                                           hover:bg-red-50
	                                           transition"
	                                    data-language="pa"
	                                    data-name="ਪੰਜਾਬੀ">

	                                <span class="font-semibold text-gray-800">
	                                    ਪੰਜਾਬੀ
	                                </span>

	                                <span class="text-xs text-gray-400">
	                                    ਪੰਜਾਬੀ
	                                </span>

	                            </button>


	                            <!-- ODIA -->

	                            <button type="button"
	                                    class="language-option
	                                           flex items-center justify-between
	                                           px-3 py-3
	                                           rounded-xl
	                                           border border-gray-200
	                                           hover:border-red-300
	                                           hover:bg-red-50
	                                           transition"
	                                    data-language="or"
	                                    data-name="ଓଡ଼ିଆ">

	                                <span class="font-semibold text-gray-800">
	                                    ଓଡ଼ିଆ
	                                </span>

	                                <span class="text-xs text-gray-400">
	                                    ଓଡ଼ିଆ
	                                </span>

	                            </button>


	                            <!-- ASSAMESE -->

	                            <button type="button"
	                                    class="language-option
	                                           flex items-center justify-between
	                                           px-3 py-3
	                                           rounded-xl
	                                           border border-gray-200
	                                           hover:border-red-300
	                                           hover:bg-red-50
	                                           transition"
	                                    data-language="as"
	                                    data-name="অসমীয়া">

	                                <span class="font-semibold text-gray-800">
	                                    অসমীয়া
	                                </span>

	                                <span class="text-xs text-gray-400">
	                                    অসমীয়া
	                                </span>

	                            </button>

	                        </div>

	                    </div>

	                </div>

	            </div>


	            <!-- ================================================= -->
	            <!-- CURRENT DATE -->
	            <!-- ================================================= -->
	 
	<div th:if="${category != null}"
	     class="hidden sm:block text-right">

	    <div class="text-sm md:text-2xl font-bold text-gray-900"
	         th:text="${#dates.format(category.date, 'dd MMMM yyyy')}">

	        08 September 2026

	    </div>

	    <div class="text-sm text-gray-500"
	         th:text="${category.day}">

	        Tuesday

	    </div>

	</div>

	        </div>

	    </div>



		
	</header>
	
	<!-- ===================================================== -->
	<!-- SUBCATEGORY NAVIGATION -->
	<!-- ===================================================== -->

	<div th:if="${category != null}"
	     class="bg-white border-b sticky top-20 z-20">

	    <div class="max-w-[1600px] mx-auto">

<div id="sectionNavigation">
    <a th:each="subCategory : ${subCategories}"
       th:href="@{/public/epaper/{categoryId}/{subCategoryId}
                  (categoryId=${category.id}, subCategoryId=${subCategory.id})}"
       class="section-btn inline-block px-8 py-4 text-sm font-semibold
              border-b-4 border-transparent transition"
       th:classappend="${selectedSubCategory != null
                    and selectedSubCategory.id == subCategory.id}
                    ? ' active-section' : ''"
       th:text="${subCategory.name}">
        National
    </a>
</div>

	    </div>

	</div>
</div>
